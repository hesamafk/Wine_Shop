name: Static site quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check local stylesheets and in-page anchors
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids, self.links = set(), []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'): self.ids.add(attrs['id'])
                  if tag == 'link' and attrs.get('rel') == 'stylesheet' and attrs.get('href'):
                      self.links.append(('asset', attrs['href']))
                  if tag == 'a' and attrs.get('href'):
                      self.links.append(('link', attrs['href']))
          failures = []
          html_files = sorted(Path('.').rglob('*.html'))
          if not html_files:
              print('No HTML files found; nothing to audit.')
              sys.exit(0)
          for page in html_files:
              parser = Audit()
              try: parser.feed(page.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'{page}: cannot parse HTML: {exc}')
                  continue
              for kind, href in parser.links:
                  if href.startswith(('https://','http://','mailto:','tel:','data:','javascript:')): continue
                  if kind == 'asset':
                      target = (page.parent / href.split('#',1)[0].split('?',1)[0]).resolve()
                      if not target.is_file(): failures.append(f'{page}: missing stylesheet {href}')
                  elif href.startswith('#'):
                      if href[1:] and href[1:] not in parser.ids: failures.append(f'{page}: missing anchor {href}')
                  elif not href.startswith('#'):
                      target_text = href.split('#',1)[0].split('?',1)[0]
                      if target_text and not (page.parent / target_text).is_file() and not target_text.startswith(('//','#')):
                          failures.append(f'{page}: missing local link target {href}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print(f'Checked {len(html_files)} HTML page(s): local stylesheets and links look consistent.')
          PY
